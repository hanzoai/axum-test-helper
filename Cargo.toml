[package]
name = "axum-test-helper"
version = "0.4.0"
edition = "2021"
categories = ["development-tools::testing"]
description = "Extra utilities for axum"
homepage = "https://github.com/cloudwalk/axum-test-helper"
keywords = ["axum", "test", "test-framework"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cloudwalk/axum-test-helper"

[dependencies]
axum = "0.7"
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
http = "1.1"
http-body = "1.0"
bytes = "1.4"
# `make` is not in tower's default features, and src/lib.rs line 49 is
# `use tower::make::Shared;` — without it the module is gated out and the
# build stops at E0432 "unresolved import", pointing at tower's own
# `#[cfg(feature = "make")]` rather than at this manifest.
tower = { version = "0.4", features = ["make"] }
tower-service = "0.3"
serde = "1.0"
tokio = "1"
hyper = "1.0"

[dev-dependencies]
serde = { version = "1", features = ["serde_derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"

[features]
default = ["withtrace"]
cookies = ["reqwest/cookies"]
withtrace = []
withouttrace = []

